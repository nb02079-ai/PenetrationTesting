# ModSecurity v3 기본 설정 (LOGION WAF, 교육용 격리 랩)
# CASE 시연을 위해 기본은 DetectionOnly(탐지·로깅만, 차단 안 함).
#  → 모든 공격이 origin 까지 도달하므로 CASE 1~3 이 성립하고, WAF 는 "무엇을 탐지했나"만 남긴다.
#  → 차단 데모가 필요하면 아래 SecRuleEngine 를 On 으로 바꾸고 nginx 재시작.
SecRuleEngine DetectionOnly

SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off

SecTmpDir /tmp/
SecDataDir /tmp/

# 감사 로그 (Blue 가 WAF 탐지 근거로 사용)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

SecArgumentSeparator &
SecCookieFormat 0
SecDefaultAction "phase:2,log,auditlog,pass"
